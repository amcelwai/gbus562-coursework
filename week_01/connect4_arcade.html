<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect 4 Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --cell: min(11vw, 64px);
    --bg: #07021a;
    --frame: #1a3cff;
    --frame-hi: #5f7bff;
    --p1: #ff2e63;
    --p1-glow: rgba(255, 46, 99, .75);
    --p2: #ffd400;
    --p2-glow: rgba(255, 212, 0, .75);
    --cyan: #00f0ff;
    --green: #39ff14;
    --text: #e8e8ff;
    --font: "Press Start 2P", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at center, #1b0b45 0%, var(--bg) 70%);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
    min-height: 100vh;
  }
  /* CRT scanlines + vignette */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px);
    pointer-events: none;
    z-index: 50;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.65) 100%);
    pointer-events: none;
    z-index: 51;
    animation: flicker 6s infinite;
  }
  @keyframes flicker { 0%, 97%, 100% { opacity: 1; } 98% { opacity: .85; } }

  #cabinet {
    width: min(100vw - 16px, 560px);
    padding: 16px 0 24px;
    text-align: center;
  }
  h1 {
    font-size: clamp(18px, 5.5vw, 32px);
    margin: 8px 0 14px;
    letter-spacing: 2px;
    color: var(--cyan);
    text-shadow: 0 0 6px var(--cyan), 3px 3px 0 #ff00c8;
  }
  h1 .four { color: var(--p2); text-shadow: 0 0 8px var(--p2), 3px 3px 0 var(--p1); }

  /* Scoreboard */
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: clamp(8px, 2.4vw, 12px);
    margin: 0 auto 12px;
    width: calc(var(--cell) * 7 + 24px);
    max-width: 100%;
  }
  .score {
    padding: 8px 10px;
    border: 3px solid currentColor;
    min-width: 30%;
    line-height: 1.8;
    transition: box-shadow .2s, transform .2s;
  }
  .score .num { font-size: 1.6em; display: block; }
  #score1 { color: var(--p1); }
  #score2 { color: var(--p2); }
  .score.active { box-shadow: 0 0 14px currentColor, inset 0 0 10px currentColor; transform: scale(1.06); }
  #roundbox { color: var(--green); line-height: 1.8; }

  #status {
    min-height: 2.6em;
    font-size: clamp(9px, 2.6vw, 13px);
    line-height: 1.6;
    margin-bottom: 8px;
  }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Board */
  #board-wrap { position: relative; display: inline-block; }
  #preview-row {
    display: grid;
    grid-template-columns: repeat(7, var(--cell));
    gap: 0;
    padding: 0 16px;
    height: var(--cell);
  }
  .preview-slot { position: relative; cursor: pointer; }
  .preview-slot .chip { opacity: 0; transition: opacity .1s; }
  .preview-slot.show .chip { opacity: .9; animation: bob .6s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(-3px); } to { transform: translateY(3px); } }

  #board {
    display: grid;
    grid-template-columns: repeat(7, var(--cell));
    grid-template-rows: repeat(6, var(--cell));
    padding: 12px;
    background:
      linear-gradient(145deg, var(--frame-hi), var(--frame) 40%, #0c1d8f);
    border: 4px solid #000;
    box-shadow: 0 0 0 4px var(--frame-hi), 0 0 30px rgba(31, 79, 255, .7), 8px 8px 0 4px #000;
    position: relative;
    cursor: pointer;
  }
  .cell { position: relative; }
  .cell::before {
    content: "";
    position: absolute;
    inset: 12%;
    border-radius: 50%;
    background: #050010;
    box-shadow: inset 4px 4px 0 rgba(0,0,0,.8), inset -2px -2px 0 rgba(95,123,255,.5);
  }
  .col-hover { background: rgba(255,255,255,.07); }

  .chip {
    position: absolute;
    inset: 12%;
    border-radius: 50%;
    z-index: 2;
  }
  .chip.p1 {
    background: radial-gradient(circle at 35% 30%, #ff9db6 0 12%, var(--p1) 35%, #a0002a 100%);
    box-shadow: 0 0 10px var(--p1-glow), inset -3px -3px 0 rgba(0,0,0,.35);
  }
  .chip.p2 {
    background: radial-gradient(circle at 35% 30%, #fff6b0 0 12%, var(--p2) 35%, #a37a00 100%);
    box-shadow: 0 0 10px var(--p2-glow), inset -3px -3px 0 rgba(0,0,0,.35);
  }
  .chip.p1::after, .chip.p2::after {
    content: "";
    position: absolute;
    inset: 22%;
    border-radius: 50%;
    border: 3px dotted rgba(0,0,0,.25);
  }
  .chip.dropping { animation: drop var(--drop-time, .35s) cubic-bezier(.5, 0, 1, 1) forwards; }
  @keyframes drop {
    0%   { transform: translateY(calc(var(--drop-from) * -1)); }
    80%  { transform: translateY(0); }
    90%  { transform: translateY(-8%); }
    100% { transform: translateY(0); }
  }
  .chip.win { animation: winflash .45s steps(2) infinite; }
  @keyframes winflash {
    0%   { filter: brightness(1.6) drop-shadow(0 0 8px #fff); }
    100% { filter: brightness(.7); }
  }

  /* Overlay screens */
  .overlay {
    position: absolute;
    top: var(--cell); left: 0; right: 0; bottom: 0;
    background: rgba(5, 0, 20, .88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 10;
    padding: 12px;
    border: 4px solid var(--cyan);
    box-shadow: inset 0 0 30px rgba(0, 240, 255, .35);
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: clamp(12px, 3.6vw, 20px); margin: 0; line-height: 1.6; }
  .overlay p { font-size: clamp(8px, 2.2vw, 11px); margin: 0; line-height: 1.8; color: #b9b9e8; }
  .btn {
    font-family: var(--font);
    font-size: clamp(9px, 2.6vw, 13px);
    padding: 12px 16px;
    background: #000;
    color: var(--green);
    border: 3px solid var(--green);
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--green);
    min-width: 70%;
  }
  .btn:hover, .btn:focus-visible, .btn.selected {
    background: var(--green);
    color: #000;
    outline: none;
  }
  .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--green); }

  #controls {
    margin-top: 16px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .small-btn {
    font-family: var(--font);
    font-size: clamp(7px, 2vw, 10px);
    padding: 8px 10px;
    background: transparent;
    color: var(--cyan);
    border: 2px solid var(--cyan);
    cursor: pointer;
  }
  .small-btn:hover, .small-btn:focus-visible { background: var(--cyan); color: #000; outline: none; }
  #help {
    margin-top: 14px;
    font-size: clamp(6px, 1.8vw, 9px);
    line-height: 2;
    color: #8080b8;
  }
  #credit { color: #ff00c8; }
</style>
</head>
<body>
<div id="cabinet">
  <h1>CONNECT <span class="four">4</span></h1>

  <div id="hud">
    <div class="score" id="score1">P1<span class="num" id="s1">0</span></div>
    <div id="roundbox">ROUND<br><span id="round">1</span></div>
    <div class="score" id="score2"><span id="p2label">P2</span><span class="num" id="s2">0</span></div>
  </div>

  <div id="status"></div>

  <div id="board-wrap">
    <div id="preview-row"></div>
    <div id="board" aria-label="Connect four board" role="grid"></div>

    <div class="overlay" id="title-screen">
      <h2 style="color:var(--p2)">SELECT MODE</h2>
      <button class="btn" id="btn-1p" data-mode="1">1 PLAYER vs CPU</button>
      <button class="btn" id="btn-2p" data-mode="2">2 PLAYERS</button>
      <p class="blink" id="credit">INSERT COIN &mdash; PRESS 1 OR 2</p>
    </div>

    <div class="overlay hidden" id="end-screen">
      <h2 id="end-title">PLAYER 1 WINS!</h2>
      <p id="end-sub">GAME OVER</p>
      <button class="btn" id="btn-next">NEXT ROUND</button>
      <button class="btn" id="btn-menu-end">MAIN MENU</button>
      <p>ENTER = NEXT ROUND &nbsp; ESC = MENU</p>
    </div>
  </div>

  <div id="controls">
    <button class="small-btn" id="btn-restart">RESTART ROUND</button>
    <button class="small-btn" id="btn-menu">MENU</button>
    <button class="small-btn" id="btn-sound">SOUND: ON</button>
  </div>

  <div id="help">
    CLICK A COLUMN TO DROP &nbsp;|&nbsp; &larr; &rarr; MOVE &nbsp; SPACE/ENTER DROP<br>
    1-7 QUICK DROP &nbsp; R RESTART &nbsp; M SOUND &nbsp; ESC MENU
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ================= GAME LOGIC (pure functions) ================= */
  const ROWS = 6, COLS = 7, EMPTY = 0;

  function createBoard() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
  }

  // Lowest empty row in a column, or -1 if the column is full.
  function getDropRow(board, col) {
    if (col < 0 || col >= COLS) return -1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][col] === EMPTY) return r;
    }
    return -1;
  }

  function validMoves(board) {
    const moves = [];
    for (let c = 0; c < COLS; c++) if (board[0][c] === EMPTY) moves.push(c);
    return moves;
  }

  function isFull(board) { return validMoves(board).length === 0; }

  // Returns the list of winning cells through (row, col), or null.
  function findWin(board, row, col) {
    const p = board[row][col];
    if (p === EMPTY) return null;
    const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (const [dr, dc] of dirs) {
      const cells = [[row, col]];
      for (const sign of [1, -1]) {
        let r = row + dr * sign, c = col + dc * sign;
        while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === p) {
          cells.push([r, c]);
          r += dr * sign; c += dc * sign;
        }
      }
      if (cells.length >= 4) return cells;
    }
    return null;
  }

  function hasAnyWin(board, p) {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (board[r][c] === p && findWin(board, r, c)) return true;
    return false;
  }

  /* ---------- CPU opponent: minimax with alpha-beta ---------- */
  function scoreWindow(w, p) {
    const o = p === 1 ? 2 : 1;
    let mine = 0, theirs = 0, empty = 0;
    for (const v of w) { if (v === p) mine++; else if (v === o) theirs++; else empty++; }
    if (mine === 4) return 1000;
    if (mine === 3 && empty === 1) return 6;
    if (mine === 2 && empty === 2) return 2;
    if (theirs === 3 && empty === 1) return -8;
    return 0;
  }

  function evaluate(board, p) {
    let score = 0;
    for (let r = 0; r < ROWS; r++) if (board[r][3] === p) score += 4; // center column bonus
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        if (c + 3 < COLS) score += scoreWindow([board[r][c], board[r][c+1], board[r][c+2], board[r][c+3]], p);
        if (r + 3 < ROWS) score += scoreWindow([board[r][c], board[r+1][c], board[r+2][c], board[r+3][c]], p);
        if (r + 3 < ROWS && c + 3 < COLS) score += scoreWindow([board[r][c], board[r+1][c+1], board[r+2][c+2], board[r+3][c+3]], p);
        if (r + 3 < ROWS && c - 3 >= 0) score += scoreWindow([board[r][c], board[r+1][c-1], board[r+2][c-2], board[r+3][c-3]], p);
      }
    return score;
  }

  const ORDER = [3, 2, 4, 1, 5, 0, 6]; // search center first

  function minimax(board, depth, alpha, beta, maximizing, cpu, lastMove) {
    const human = cpu === 1 ? 2 : 1;
    if (lastMove) {
      const [lr, lc] = lastMove;
      if (findWin(board, lr, lc)) {
        // The player who just moved won.
        return board[lr][lc] === cpu ? 100000 + depth : -100000 - depth;
      }
    }
    const moves = ORDER.filter(c => board[0][c] === EMPTY);
    if (moves.length === 0) return 0;
    if (depth === 0) return evaluate(board, cpu);

    if (maximizing) {
      let best = -Infinity;
      for (const c of moves) {
        const r = getDropRow(board, c);
        board[r][c] = cpu;
        best = Math.max(best, minimax(board, depth - 1, alpha, beta, false, cpu, [r, c]));
        board[r][c] = EMPTY;
        alpha = Math.max(alpha, best);
        if (alpha >= beta) break;
      }
      return best;
    } else {
      let best = Infinity;
      for (const c of moves) {
        const r = getDropRow(board, c);
        board[r][c] = human;
        best = Math.min(best, minimax(board, depth - 1, alpha, beta, true, cpu, [r, c]));
        board[r][c] = EMPTY;
        beta = Math.min(beta, best);
        if (alpha >= beta) break;
      }
      return best;
    }
  }

  function bestMove(board, cpu, depth = 5) {
    const b = board.map(row => row.slice());
    const moves = ORDER.filter(c => b[0][c] === EMPTY);
    let bestScore = -Infinity, choice = moves[0];
    for (const c of moves) {
      const r = getDropRow(b, c);
      b[r][c] = cpu;
      const s = minimax(b, depth - 1, -Infinity, Infinity, false, cpu, [r, c]);
      b[r][c] = EMPTY;
      if (s > bestScore) { bestScore = s; choice = c; }
    }
    return choice;
  }

  /* ================= SOUND (tiny chiptune bleeps) ================= */
  let audioCtx = null, soundOn = true;
  function tone(freq, dur, type = "square", when = 0, vol = 0.06) {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime + when;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (e) { /* audio unavailable: play silently */ }
  }
  const sfx = {
    move:  () => tone(660, 0.04),
    drop:  (p) => { tone(p === 1 ? 300 : 380, 0.08); tone(p === 1 ? 150 : 190, 0.12, "triangle", 0.06); },
    bad:   () => tone(110, 0.15, "sawtooth"),
    start: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.1, "square", i * 0.09)),
    win:   () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.14, "square", i * 0.12)),
    draw:  () => [440, 370, 311, 262].forEach((f, i) => tone(f, 0.16, "triangle", i * 0.14)),
    lose:  () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.18, "sawtooth", i * 0.16, 0.04)),
  };

  /* ================= STATE ================= */
  const state = {
    board: createBoard(),
    mode: null,          // 1 = vs CPU, 2 = two players
    current: 1,
    starter: 1,          // who starts this round (alternates)
    cursor: 3,
    busy: false,         // true during animations / CPU thinking
    over: false,
    scores: { 1: 0, 2: 0 },
    round: 1,
    screen: "title",     // "title" | "play" | "end"
    menuIndex: 0,
    winCells: null,
    moveCount: 0,
  };
  const CPU = 2;
  let pendingTimers = [];
  function later(fn, ms) {
    const id = setTimeout(() => { pendingTimers = pendingTimers.filter(t => t !== id); fn(); }, ms);
    pendingTimers.push(id);
    return id;
  }
  function clearTimers() { pendingTimers.forEach(clearTimeout); pendingTimers = []; }

  /* ================= DOM ================= */
  const $ = (id) => document.getElementById(id);
  const boardEl = $("board"), previewRow = $("preview-row");
  const cells = [];   // cells[r][c] -> element
  const previews = [];

  function buildBoard() {
    boardEl.innerHTML = ""; previewRow.innerHTML = "";
    for (let r = 0; r < ROWS; r++) {
      cells[r] = [];
      for (let c = 0; c < COLS; c++) {
        const el = document.createElement("div");
        el.className = "cell";
        el.dataset.row = r; el.dataset.col = c;
        el.setAttribute("role", "gridcell");
        boardEl.appendChild(el);
        cells[r][c] = el;
      }
    }
    for (let c = 0; c < COLS; c++) {
      const slot = document.createElement("div");
      slot.className = "preview-slot";
      slot.dataset.col = c;
      slot.innerHTML = '<div class="chip"></div>';
      previewRow.appendChild(slot);
      previews.push(slot);
    }
  }

  function isHumanTurn() {
    return state.screen === "play" && !state.over && !state.busy &&
           !(state.mode === 1 && state.current === CPU);
  }

  function playerName(p) {
    if (state.mode === 1) return p === 1 ? "YOU" : "CPU";
    return "PLAYER " + p;
  }

  function renderHUD() {
    $("s1").textContent = state.scores[1];
    $("s2").textContent = state.scores[2];
    $("round").textContent = state.round;
    $("p2label").textContent = state.mode === 1 ? "CPU" : "P2";
    $("score1").classList.toggle("active", state.screen === "play" && !state.over && state.current === 1);
    $("score2").classList.toggle("active", state.screen === "play" && !state.over && state.current === 2);

    const status = $("status");
    if (state.screen === "title") {
      status.innerHTML = '<span class="blink" style="color:var(--cyan)">READY PLAYER ONE?</span>';
    } else if (state.over) {
      status.textContent = state.winCells ? playerName(state.current) + " CONNECTED 4!" : "BOARD FULL!";
    } else if (state.mode === 1 && state.current === CPU) {
      status.innerHTML = '<span style="color:var(--p2)">CPU THINKING<span class="blink">...</span></span>';
    } else {
      const color = state.current === 1 ? "var(--p1)" : "var(--p2)";
      status.innerHTML = '<span style="color:' + color + '">' + playerName(state.current) +
        (state.mode === 1 ? "R TURN" : "'S TURN") + "</span>";
    }
    renderPreview();
  }

  function renderPreview() {
    const show = isHumanTurn();
    previews.forEach((slot, c) => {
      const chip = slot.firstChild;
      chip.className = "chip p" + state.current;
      slot.classList.toggle("show", show && c === state.cursor);
    });
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        cells[r][c].classList.toggle("col-hover", show && c === state.cursor);
  }

  function clearChips() {
    boardEl.querySelectorAll(".chip").forEach(ch => ch.remove());
  }

  function showOverlay(id) {
    ["title-screen", "end-screen"].forEach(o => $(o).classList.toggle("hidden", o !== id));
  }

  function setMenuSelection(i) {
    state.menuIndex = i;
    const btns = state.screen === "title" ? [$("btn-1p"), $("btn-2p")] : [$("btn-next"), $("btn-menu-end")];
    btns.forEach((b, j) => b.classList.toggle("selected", j === i));
  }

  /* ================= FLOW ================= */
  function goToTitle() {
    clearTimers();
    state.screen = "title";
    state.mode = null;
    state.scores = { 1: 0, 2: 0 };
    state.round = 1;
    state.starter = 1;
    resetBoard();
    showOverlay("title-screen");
    setMenuSelection(0);
    renderHUD();
  }

  function resetBoard() {
    clearTimers();
    state.board = createBoard();
    state.over = false;
    state.busy = false;
    state.winCells = null;
    state.moveCount = 0;
    state.current = state.starter;
    state.cursor = 3;
    clearChips();
  }

  function startGame(mode) {
    state.mode = mode;
    state.scores = { 1: 0, 2: 0 };
    state.round = 1;
    state.starter = 1;
    state.screen = "play";
    resetBoard();
    showOverlay(null);
    sfx.start();
    renderHUD();
    maybeCpuTurn();
  }

  function restartRound() {
    if (state.screen !== "play" && state.screen !== "end") return;
    state.screen = "play";
    resetBoard();
    showOverlay(null);
    renderHUD();
    maybeCpuTurn();
  }

  function nextRound() {
    state.round++;
    state.starter = state.starter === 1 ? 2 : 1;   // alternate who goes first
    state.screen = "play";
    resetBoard();
    showOverlay(null);
    sfx.start();
    renderHUD();
    maybeCpuTurn();
  }

  // Drop a chip for the current player. Returns true if the move was accepted.
  function dropInColumn(col) {
    if (state.screen !== "play" || state.over || state.busy) return false;
    const row = getDropRow(state.board, col);
    if (row < 0) { sfx.bad(); shakeColumn(col); return false; }

    const p = state.current;
    state.board[row][col] = p;
    state.moveCount++;
    state.busy = true;
    state.cursor = col;
    renderPreview();

    const chip = document.createElement("div");
    chip.className = "chip p" + p + " dropping";
    const dist = (row + 1);
    chip.style.setProperty("--drop-from", "calc(" + dist + " * var(--cell) + 12px)");
    const ms = 180 + row * 45;
    chip.style.setProperty("--drop-time", ms + "ms");
    cells[row][col].appendChild(chip);
    sfx.move();

    later(() => {
      chip.classList.remove("dropping");
      sfx.drop(p);
      afterMove(row, col, p);
    }, ms);
    return true;
  }

  function afterMove(row, col, p) {
    const win = findWin(state.board, row, col);
    if (win) {
      state.over = true;
      state.busy = false;
      state.winCells = win;
      state.scores[p]++;
      win.forEach(([r, c]) => { const ch = cells[r][c].querySelector(".chip"); if (ch) ch.classList.add("win"); });
      (state.mode === 1 && p === CPU) ? sfx.lose() : sfx.win();
      renderHUD();
      later(() => endScreen(p), 1400);
      return;
    }
    if (isFull(state.board)) {
      state.over = true;
      state.busy = false;
      state.winCells = null;
      sfx.draw();
      renderHUD();
      later(() => endScreen(0), 900);
      return;
    }
    state.current = p === 1 ? 2 : 1;
    state.busy = false;
    renderHUD();
    maybeCpuTurn();
  }

  function endScreen(winner) {
    state.screen = "end";
    const title = $("end-title"), sub = $("end-sub");
    if (winner === 0) {
      title.textContent = "DRAW GAME";
      title.style.color = "var(--cyan)";
      sub.textContent = "NO ONE CONNECTED 4";
    } else if (state.mode === 1) {
      title.textContent = winner === 1 ? "YOU WIN!" : "CPU WINS!";
      title.style.color = winner === 1 ? "var(--p1)" : "var(--p2)";
      sub.textContent = winner === 1 ? "HIGH SCORE MATERIAL!" : "GAME OVER - TRY AGAIN?";
    } else {
      title.textContent = "PLAYER " + winner + " WINS!";
      title.style.color = winner === 1 ? "var(--p1)" : "var(--p2)";
      sub.textContent = "FLAWLESS VICTORY";
    }
    sub.textContent += "  |  SCORE " + state.scores[1] + " - " + state.scores[2];
    showOverlay("end-screen");
    setMenuSelection(0);
    renderHUD();
  }

  function maybeCpuTurn() {
    if (state.mode !== 1 || state.current !== CPU || state.over || state.screen !== "play") return;
    state.busy = true;
    renderHUD();
    later(() => {
      const col = bestMove(state.board, CPU, 5);
      state.cursor = col;
      state.busy = false;
      dropInColumn(col);
    }, 550);
  }

  function shakeColumn(col) {
    for (let r = 0; r < ROWS; r++) {
      const el = cells[r][col];
      el.animate([{ transform: "translateX(-3px)" }, { transform: "translateX(3px)" }, { transform: "translateX(0)" }],
                 { duration: 160, iterations: 2 });
    }
  }

  /* ================= INPUT ================= */
  function colFromEvent(e) {
    const t = e.target.closest("[data-col]");
    return t ? parseInt(t.dataset.col, 10) : null;
  }

  function onPointerMove(e) {
    if (!isHumanTurn()) return;
    const c = colFromEvent(e);
    if (c !== null && c !== state.cursor) { state.cursor = c; renderPreview(); }
  }
  function onClick(e) {
    if (!isHumanTurn()) return;
    const c = colFromEvent(e);
    if (c !== null) dropInColumn(c);
  }
  boardEl.addEventListener("mousemove", onPointerMove);
  previewRow.addEventListener("mousemove", onPointerMove);
  boardEl.addEventListener("click", onClick);
  previewRow.addEventListener("click", onClick);

  $("btn-1p").addEventListener("click", () => startGame(1));
  $("btn-2p").addEventListener("click", () => startGame(2));
  $("btn-next").addEventListener("click", () => nextRound());
  $("btn-menu-end").addEventListener("click", () => goToTitle());
  $("btn-restart").addEventListener("click", (e) => { e.currentTarget.blur(); restartRound(); });
  $("btn-menu").addEventListener("click", (e) => { e.currentTarget.blur(); goToTitle(); });
  $("btn-sound").addEventListener("click", (e) => { e.currentTarget.blur(); toggleSound(); });

  function toggleSound() {
    soundOn = !soundOn;
    $("btn-sound").textContent = "SOUND: " + (soundOn ? "ON" : "OFF");
    if (soundOn) tone(880, 0.06);
  }

  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "m" || k === "M") { toggleSound(); return; }
    if (k === "Escape") { goToTitle(); return; }

    if (state.screen === "title") {
      if (k === "1") startGame(1);
      else if (k === "2") startGame(2);
      else if (k === "ArrowUp" || k === "ArrowDown") { setMenuSelection(state.menuIndex ? 0 : 1); sfx.move(); e.preventDefault(); }
      else if (k === "Enter" || k === " ") { e.preventDefault(); startGame(state.menuIndex === 0 ? 1 : 2); }
      return;
    }
    if (state.screen === "end") {
      if (k === "ArrowUp" || k === "ArrowDown") { setMenuSelection(state.menuIndex ? 0 : 1); sfx.move(); e.preventDefault(); }
      else if (k === "Enter" || k === " ") { e.preventDefault(); state.menuIndex === 0 ? nextRound() : goToTitle(); }
      else if (k === "r" || k === "R") restartRound();
      return;
    }
    // play screen
    if (k === "r" || k === "R") { restartRound(); return; }
    if (!isHumanTurn()) return;
    if (k === "ArrowLeft")  { state.cursor = (state.cursor + COLS - 1) % COLS; sfx.move(); renderPreview(); e.preventDefault(); }
    else if (k === "ArrowRight") { state.cursor = (state.cursor + 1) % COLS; sfx.move(); renderPreview(); e.preventDefault(); }
    else if (k === "Enter" || k === " " || k === "ArrowDown") { e.preventDefault(); dropInColumn(state.cursor); }
    else if (k >= "1" && k <= "7") { dropInColumn(parseInt(k, 10) - 1); }
  });

  /* ================= BOOT ================= */
  buildBoard();
  goToTitle();

  // Exposed for automated testing / debugging.
  window.C4 = { ROWS, COLS, createBoard, getDropRow, validMoves, isFull, findWin, hasAnyWin, bestMove, state,
                startGame, dropInColumn, restartRound, nextRound, goToTitle };
})();
</script>
</body>
</html>
